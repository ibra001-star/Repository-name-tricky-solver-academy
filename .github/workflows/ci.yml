name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR when a new commit is pushed,
# so we don't waste CI minutes running checks against stale code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  api:
    name: API — lint, typecheck, test, build
    runs-on: ubuntu-latest

    # A real Postgres instance for the test suite — matches what the app
    # actually runs against in production, rather than mocking the DB layer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsa_user
          POSTGRES_PASSWORD: tsa_password
          POSTGRES_DB: tricky_solver_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsa_user -d tricky_solver_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://tsa_user:tsa_password@localhost:5432/tricky_solver_academy_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-not-used-in-production-environments-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-used-in-production-environments-only
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      # NOTE: this repo does not yet have committed migration files under
      # prisma/migrations/ (generating them requires a one-time connection
      # to a real Postgres instance — see README "First-Time Migration
      # Setup"). `migrate dev` works standalone against CI's ephemeral
      # database without requiring pre-committed migrations. Once initial
      # migrations are generated and committed, switch this to
      # `npx prisma migrate deploy` to match the production deploy workflow
      # exactly and catch any migration-drift issues in CI.
      - name: Apply schema to test database
        run: npx prisma migrate dev --name init

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies (production only)
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      # A placeholder API URL is sufficient for a production build — no
      # requests are actually made at build time, only at runtime.
      NEXT_PUBLIC_API_URL: https://api.trickysolver.academy/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit dependencies (production only)
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: Verify Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          tags: tricky-solver-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          target: production
          tags: tricky-solver-web:ci
